# GitHub acceleration: probe mirrors, rewrite GitHub URLs, and download or
# shallow-clone through the fastest healthy one.
# Every value below is optional; defaults live in lib/core.js.
- insert:
    - id: dsh-github-accel
      name: dsh-github-accel
      config:
        # 'auto' ranks mirrors by a live probe; a mirror id (for example
        # 'ghproxy' or 'kkgithub') pins one.
        defaultMirror: auto
        # Try direct github.com after every mirror has failed.
        directFallback: true
        # How long a probe result stays valid, in seconds.
        probeTtlSeconds: 600
        # Timeout for one download or read attempt, in milliseconds.
        timeoutMs: 20000
        # Merge the OS certificate store into Node's roots. Leave on behind a
        # TLS-inspecting corporate proxy; it is a no-op elsewhere.
        trustSystemCa: true
        # Shallow-clone depth.
        cloneDepth: 1
        # Replace the built-in mirror list when the defaults do not fit.
        # mirrors:
        #   - { id: ghproxy, label: ghproxy.net, mode: prefix, base: 'https://ghproxy.net/' }
        #   - { id: kkgithub, label: kkgithub.com, mode: host, base: 'https://kkgithub.com', hosts: [github.com], caps: [web, clone] }
